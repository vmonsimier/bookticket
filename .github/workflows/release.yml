name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Get release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"
